<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Presentation, UCSB AEC</title>
  <style>
    :root {
      --bg:#090F1A; --surface:#0E1829; --navy:#162438;
      --gold:#C4A448; --gold-lt:#D4B55E; --gold-dim:rgba(196,164,72,0.10);
      --text:#FFFFFF; --muted:rgba(255,255,255,0.62); --border:rgba(255,255,255,0.07);
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { height:100%; }
    body {
      background:var(--bg); color:var(--text); overflow:hidden;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif;
    }
    .stage { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }

    /* Background motif: faint ghost monogram + rising chart line, on every slide */
    .bg-motif { position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:0; }
    .bg-monogram { position:absolute; right:-3vw; top:-6vh; font-family:Georgia,serif;
      font-weight:700; font-size:62vh; line-height:1; color:transparent;
      -webkit-text-stroke:2px rgba(196,164,72,0.05); user-select:none; }
    .bg-chart { position:absolute; left:0; bottom:0; width:100%; height:34vh; opacity:.5; }

    .slide {
      position:relative; z-index:1;
      width:min(92vw,1100px); max-height:88vh; padding:min(6vh,56px) min(5vw,64px);
      display:none; flex-direction:column; justify-content:center; gap:24px;
    }
    .slide.on { display:flex; }
    /* Staggered entrance: each direct child rises in, one after another */
    .slide.on > * { opacity:0; animation:riseIn .5s cubic-bezier(.2,.7,.2,1) forwards; }
    .slide.on > *:nth-child(1){ animation-delay:.05s; }
    .slide.on > *:nth-child(2){ animation-delay:.15s; }
    .slide.on > *:nth-child(3){ animation-delay:.25s; }
    .slide.on > *:nth-child(4){ animation-delay:.34s; }
    .slide.on > *:nth-child(5){ animation-delay:.42s; }
    .slide.on > *:nth-child(6){ animation-delay:.50s; }
    @keyframes riseIn { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:none; } }

    .eyebrow { color:var(--gold); font-size:clamp(12px,1.3vw,15px); font-weight:700;
               letter-spacing:.16em; text-transform:uppercase; }
    /* Animated gold underline that grows under headings */
    h1, h2 { position:relative; padding-bottom:.24em; }
    h1::after, h2::after { content:""; position:absolute; left:0; bottom:0; height:4px;
      width:0; background:linear-gradient(90deg,var(--gold),transparent); border-radius:2px;
      animation:grow .7s .35s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes grow { to { width:clamp(90px,22%,220px); } }
    h1 { font-size:clamp(34px,5.4vw,64px); line-height:1.08; letter-spacing:-0.02em; }
    h2 { font-size:clamp(24px,3.4vw,40px); line-height:1.15; letter-spacing:-0.015em; }
    .sub { color:var(--muted); font-size:clamp(16px,1.9vw,22px); max-width:48ch; line-height:1.5; }

    ul.points { list-style:none; display:flex; flex-direction:column; gap:16px; }
    ul.points li {
      position:relative; padding-left:30px;
      font-size:clamp(17px,2.1vw,25px); line-height:1.45; color:rgba(255,255,255,.88);
    }
    ul.points li::before {
      content:""; position:absolute; left:0; top:.55em; width:14px; height:3px;
      background:var(--gold); border-radius:2px;
    }

    .cols { display:grid; grid-template-columns:1fr 1fr; gap:34px; }
    .col { background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:26px; }
    .col h3 { color:var(--gold-lt); font-size:clamp(15px,1.6vw,19px); margin-bottom:14px;
              letter-spacing:.04em; text-transform:uppercase; }
    .col ul.points li { font-size:clamp(15px,1.7vw,20px); }

    .stats { display:flex; gap:26px; flex-wrap:wrap; justify-content:center; width:100%; }
    .stat { flex:1 1 180px; background:var(--gold-dim); border:1px solid rgba(196,164,72,.25);
            border-radius:18px; padding:26px 22px; transition:transform .3s, box-shadow .3s; }
    .stat:hover { transform:translateY(-3px); box-shadow:0 14px 34px rgba(0,0,0,.35); }
    .stat .v { color:var(--gold-lt); font-size:clamp(30px,4vw,52px); font-weight:800; letter-spacing:-0.02em; }
    .stat .l { color:var(--muted); font-size:clamp(13px,1.4vw,16px); margin-top:6px; line-height:1.4; }

    blockquote { font-size:clamp(22px,3vw,36px); line-height:1.4; font-style:italic;
                 border-left:4px solid var(--gold); padding-left:26px; max-width:26ch; }
    .attr { color:var(--muted); font-size:clamp(14px,1.6vw,18px); }

    .srcs { display:flex; flex-direction:column; gap:12px; }
    .srcs a { color:var(--gold-lt); text-decoration:none; font-size:clamp(13px,1.5vw,17px);
              word-break:break-all; line-height:1.4; }
    .srcs a:hover { text-decoration:underline; }

    .hud { position:fixed; left:0; right:0; bottom:0; display:flex; align-items:center;
           justify-content:space-between; padding:14px 22px; font-size:13px; color:var(--muted); }
    .hud .brand { color:var(--gold); font-weight:700; letter-spacing:.12em; text-transform:uppercase; font-size:11px; }
    .bar { position:fixed; top:0; left:0; height:3px; background:var(--gold); transition:width .3s ease; }
    .state { position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
             color:var(--muted); font-size:17px; text-align:center; padding:20px; }
    a:focus-visible, [tabindex]:focus-visible { outline:2px solid var(--gold); outline-offset:3px; }
    @media (prefers-reduced-motion: reduce) {
      .slide.on > * { opacity:1; animation:none; }
      h1::after, h2::after { width:clamp(90px,22%,220px); animation:none; }
    }
    @media (max-width:700px){ .cols { grid-template-columns:1fr; } }
    .stat { flex:0 1 300px; text-align:center; }
    .imgwrap { margin:2vh auto 0; max-width:82%; display:flex; justify-content:center;
      animation:imgIn .7s cubic-bezier(.2,.7,.2,1) both; }
    .imgwrap img { max-width:100%; max-height:52vh; object-fit:contain; border-radius:14px;
      box-shadow:0 24px 70px rgba(0,0,0,.5); border:1px solid rgba(212,181,94,.25); background:#0d0f14; }
    .slide .cap { margin-top:1.3vh; text-align:center; color:rgba(255,255,255,.82);
      font-size:clamp(15px,1.7vw,20px); }
    @keyframes imgIn { from{opacity:0; transform:scale(.97)} to{opacity:1; transform:none} }
    .kicker { color:var(--gold-lt); font-size:clamp(11px,1.2vw,14px); font-weight:800;
      letter-spacing:.22em; text-transform:uppercase; opacity:.92; }
    .subline { color:var(--muted); font-style:italic; font-size:clamp(15px,1.8vw,21px); margin-top:-8px; }
    .cards { display:grid; grid-template-columns:repeat(2,1fr); gap:18px; width:100%; }
    .card { background:rgba(255,255,255,.035); border:1px solid rgba(212,181,94,.16);
      border-radius:14px; padding:20px 22px; text-align:left; }
    .card .num { display:inline-flex; align-items:center; justify-content:center;
      width:30px; height:30px; border-radius:8px; background:rgba(212,181,94,.14);
      color:var(--gold-lt); font-weight:800; font-size:14px; margin-bottom:10px; }
    .card h4 { margin:0 0 6px; color:var(--gold-lt); font-size:clamp(15px,1.8vw,20px); }
    .card p { margin:0; color:rgba(255,255,255,.78); font-size:clamp(13px,1.5vw,17px); line-height:1.45; }
    .srcline { position:absolute; left:min(5vw,64px); bottom:12px; color:rgba(255,255,255,.34);
      font-size:clamp(10px,1.1vw,13px); }
    #notes { position:fixed; left:0; right:0; bottom:0; z-index:30; display:none;
      background:rgba(10,12,17,.96); border-top:1px solid rgba(212,181,94,.3);
      padding:18px min(5vw,64px) 26px; max-height:38vh; overflow:auto;
      color:rgba(255,255,255,.85); font-size:15px; line-height:1.55; white-space:pre-wrap; }
    #notes.open { display:block; }
    #notes .nlabel { color:var(--gold-lt); font-weight:800; letter-spacing:.14em;
      text-transform:uppercase; font-size:11px; margin-bottom:8px; }
    @media (max-width:640px){ .cards { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <div class="bar" id="bar"></div>
  <div class="bg-motif" aria-hidden="true">
    <div class="bg-monogram">AE</div>
    <svg class="bg-chart" viewBox="0 0 1200 240" preserveAspectRatio="none">
      <path d="M0,210 L150,180 L300,192 L450,140 L600,158 L800,96 L1000,110 L1200,40"
            fill="none" stroke="rgba(196,164,72,0.35)" stroke-width="3"/>
      <path d="M0,210 L150,180 L300,192 L450,140 L600,158 L800,96 L1000,110 L1200,40 L1200,240 L0,240 Z"
            fill="rgba(196,164,72,0.05)"/>
    </svg>
  </div>
  <div class="stage" id="stage"><div class="state" id="state">Loading deck…</div></div>
  <div class="hud">
    <span class="brand">UCSB Applied Economics Club</span>
    <span id="pos"></span>
    <span>← → to navigate · F fullscreen</span>
  </div>
  <div id="notes"><div class="nlabel">Speaker notes · press N to hide</div><div id="ntext"></div></div>
  <script>
    const DB = 'https://applied-economics-club-default-rtdb.firebaseio.com';
    const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
                     .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    let idx = 0, total = 0;

    function slideHtml(s, deck) {
      const t = s.type;
      if (t === 'title') return `
        <img src="assets/icon.svg" alt="" style="width:92px;height:92px;margin-bottom:26px;" />
        <div class="eyebrow">UCSB Applied Economics Club</div>
        <h1>${esc(s.heading || deck.title)}</h1>
        ${s.sub || deck.subtitle ? `<p class="sub">${esc(s.sub || deck.subtitle)}</p>` : ''}`;
      if (t === 'bullets') return `
        <h2>${esc(s.heading || '')}</h2>
        <ul class="points">${(s.points||[]).map(p=>`<li>${esc(p)}</li>`).join('')}</ul>`;
      if (t === 'split') return `
        <h2>${esc(s.heading || '')}</h2>
        <div class="cols">
          ${[s.left,s.right].map(c=>c?`<div class="col"><h3>${esc(c.title||'')}</h3>
            <ul class="points">${(c.points||[]).map(p=>`<li>${esc(p)}</li>`).join('')}</ul></div>`:'').join('')}
        </div>`;
      if (t === 'stat') return `
        <h2>${esc(s.heading || '')}</h2>
        <div class="stats">${(s.stats||[]).map(x=>`<div class="stat"><div class="v">${esc(x.value)}</div>
          <div class="l">${esc(x.label)}</div></div>`).join('')}</div>`;
      if (t === 'quote') return `
        <blockquote>&ldquo;${esc(s.text || '')}&rdquo;</blockquote>
        ${s.attribution ? `<p class="attr">, ${esc(s.attribution)}</p>` : ''}`;
      if (t === 'sources') return `
        <h2>Sources</h2>
        <div class="srcs">${(s.links||[]).map(l=>{
          const u = String(l.url||''); const safe = /^https?:\/\//i.test(u) ? u : '#';
          return `<a href="${esc(safe)}" target="_blank" rel="noopener noreferrer">${esc(l.title||u)}</a>`;
        }).join('')}</div>`;
      if (t === 'chart') return chartSlide(s);
      if (t === 'cycle') return cycleSlide(s);
      if (t === 'image') return imageSlide(s);
      if (t === 'cards') return `
        <h2>${esc(s.heading || '')}</h2>
        <div class="cards">${(s.cards||[]).slice(0,6).map((c,i)=>`<div class="card">
          ${s.numbered ? `<span class="num">${String(i+1).padStart(2,'0')}</span>` : ''}
          <h4>${esc(c.title||'')}</h4><p>${esc(c.body||'')}</p></div>`).join('')}
        </div>`;
      return `<h2>${esc(s.heading || '')}</h2>`;   // unknown type: degrade gracefully
    }

    // Line or bar chart drawn as SVG from real data points. No image gen, no
    // external library, pure vector in club styling with a note label so the
    // audience knows if figures are illustrative.
    function chartSlide(s) {
      const pts = (Array.isArray(s.points) ? s.points : [])
        .map(p => ({ label: String(p.label == null ? '' : p.label), value: Number(p.value) }))
        .filter(p => isFinite(p.value));
      if (pts.length < 2) return `<h2>${esc(s.heading || '')}</h2>`;
      const W = 900, H = 430, padL = 56, padR = 24, padT = 20, padB = 54;
      const vals = pts.map(p => p.value);
      const min = Math.min(0, ...vals), max = Math.max(...vals);
      const span = (max - min) || 1;
      const x = i => padL + (i / (pts.length - 1)) * (W - padL - padR);
      const y = v => padT + (1 - (v - min) / span) * (H - padT - padB);
      const bar = s.chartType === 'bar';

      let marks = '';
      // gridlines + y labels (4 steps)
      for (let g = 0; g <= 4; g++) {
        const v = min + (span * g / 4), yy = y(v);
        marks += `<line x1="${padL}" y1="${yy}" x2="${W - padR}" y2="${yy}" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>` +
                 `<text x="${padL - 8}" y="${yy + 4}" text-anchor="end" fill="rgba(255,255,255,0.4)" font-size="13">${(Math.round(v * 100) / 100).toLocaleString()}</text>`;
      }
      let body = '';
      if (bar) {
        const bw = (W - padL - padR) / pts.length * 0.6;
        body = pts.map((p, i) => {
          const cx = x(i), yy = y(p.value), h = y(min) - yy;
          return `<rect x="${cx - bw / 2}" y="${yy}" width="${bw}" height="${Math.max(0, h)}" rx="4" fill="url(#gg)">` +
                 `<animate attributeName="height" from="0" to="${Math.max(0, h)}" dur="0.6s" begin="0.2s" fill="freeze"/>` +
                 `<animate attributeName="y" from="${y(min)}" to="${yy}" dur="0.6s" begin="0.2s" fill="freeze"/></rect>`;
        }).join('');
      } else {
        const d = pts.map((p, i) => `${i ? 'L' : 'M'}${x(i)},${y(p.value)}`).join(' ');
        const area = d + ` L${x(pts.length - 1)},${y(min)} L${x(0)},${y(min)} Z`;
        const len = 2000;
        body = `<path d="${area}" fill="rgba(196,164,72,0.10)"/>` +
               `<path d="${d}" fill="none" stroke="#C4A448" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" ` +
               `stroke-dasharray="${len}" stroke-dashoffset="${len}"><animate attributeName="stroke-dashoffset" from="${len}" to="0" dur="1s" begin="0.2s" fill="freeze"/></path>` +
               pts.map((p, i) => `<circle cx="${x(i)}" cy="${y(p.value)}" r="4.5" fill="#D4B55E" opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="${0.9 + i * 0.04}s" fill="freeze"/></circle>`).join('');
      }
      const xlabels = pts.map((p, i) => {
        const anchor = i === 0 ? 'start' : (i === pts.length - 1 ? 'end' : 'middle');
        return `<text x="${x(i)}" y="${H - padB + 22}" text-anchor="${anchor}" fill="rgba(255,255,255,0.55)" font-size="13">${esc(p.label).slice(0, 16)}</text>`;
      }).join('');
      return `
        <h2>${esc(s.heading || '')}</h2>
        <svg viewBox="0 0 ${W} ${H}" style="width:100%;max-height:56vh;">
          <defs><linearGradient id="gg" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#D4B55E"/><stop offset="1" stop-color="#8C7326"/></linearGradient></defs>
          ${marks}${body}${xlabels}
        </svg>
        ${s.note ? `<p class="attr">${esc(s.note)}</p>` : ''}`;
    }

    // Schematic cycle curve (e.g. Wyckoff phases, market cycle) with labeled
    // stages. Conceptual, not data, so it never implies fake precision.
    function cycleSlide(s) {
      const stages = (Array.isArray(s.stages) ? s.stages : []).slice(0, 6).map(x => String(x));
      const W = 900, H = 380;
      const d = `M40,300 C160,300 200,120 320,120 C440,120 470,60 560,60 C650,60 700,300 820,300`;
      const len = 2400;
      const last = stages.length - 1;
      const dots = stages.map((st, i) => {
        const cx = 40 + (i / (Math.max(1, last))) * 780;
        const cy = 300 - Math.sin((i / Math.max(1, last)) * Math.PI) * 180;
        const label = String(st).replace(/\s*\(.*$/, '').trim().slice(0, 18);
        const anchor = i === 0 ? 'start' : (i === last ? 'end' : 'middle');
        return `<circle cx="${cx}" cy="${cy}" r="6" fill="#D4B55E"/>` +
               `<text x="${cx}" y="${cy - 16}" text-anchor="${anchor}" fill="rgba(255,255,255,0.85)" font-size="16" font-weight="700">${esc(label)}</text>`;
      }).join('');
      return `
        <h2>${esc(s.heading || '')}</h2>
        <svg viewBox="0 0 ${W} ${H}" style="width:100%;max-height:54vh;">
          <path d="${d}" fill="none" stroke="#C4A448" stroke-width="3" stroke-linecap="round"
            stroke-dasharray="${len}" stroke-dashoffset="${len}">
            <animate attributeName="stroke-dashoffset" from="${len}" to="0" dur="1.1s" begin="0.2s" fill="freeze"/></path>
          ${dots}
        </svg>
        ${s.note ? `<p class="attr">${esc(s.note)}</p>` : ''}`;
    }

    // Real, free, licensed image fetched during research (Wikipedia / Wikimedia
    // Commons). The server supplies the URL + credit; we only display it, and
    // hide the frame if it fails to load so a slide never shows a broken image.
    function imageSlide(s) {
      const u = String(s.url || '');
      const safe = /^https?:\/\//i.test(u) ? u : '';
      if (!safe) return `<h2>${esc(s.heading || '')}</h2>`;
      return `
        <h2>${esc(s.heading || '')}</h2>
        <div class="imgwrap">
          <img src="${esc(safe)}" alt="${esc(s.caption || '')}"
               onerror="var w=this.closest('.imgwrap'); if(w) w.style.display='none';"/>
        </div>
        ${s.caption ? `<p class="cap">${esc(s.caption)}</p>` : ''}
        ${s.credit ? `<p class="attr">${esc(s.credit)}</p>` : ''}`;
    }

    function countUp(el) {
      const raw = el.getAttribute('data-v') || el.textContent;
      const m = String(raw).match(/^(\D*)([\d,.]+)(.*)$/);   // prefix, number, suffix ($, %, etc.)
      if (!m) return;
      const pre = m[1], suf = m[3], target = parseFloat(m[2].replace(/,/g, ''));
      if (!isFinite(target)) return;
      const dec = (m[2].split('.')[1] || '').length;
      const t0 = performance.now(), dur = 700;
      (function step(t) {
        const k = Math.min(1, (t - t0) / dur);
        const val = (target * (1 - Math.pow(1 - k, 3)));
        el.textContent = pre + val.toLocaleString('en-US', { minimumFractionDigits: dec, maximumFractionDigits: dec }) + suf;
        if (k < 1) requestAnimationFrame(step);
        else el.textContent = pre + m[2] + suf;
      })(t0);
    }
    function show(i) {
      idx = Math.max(0, Math.min(total - 1, i));
      document.querySelectorAll('.slide').forEach((el, n) => el.classList.toggle('on', n === idx));
      document.getElementById('pos').textContent = (idx + 1) + ' / ' + total;
      document.getElementById('bar').style.width = ((idx + 1) / total * 100) + '%';
      // Animate any stat numbers on the newly shown slide.
      const nEl = document.getElementById('ntext');
      if (nEl && window._deckSlides) nEl.textContent = (window._deckSlides[idx] && window._deckSlides[idx].notes) || 'No notes for this slide.';
      const active = document.querySelectorAll('.slide')[idx];
      if (active) active.querySelectorAll('.stat .v').forEach(v => {
        if (!v.getAttribute('data-v')) v.setAttribute('data-v', v.textContent);
        countUp(v);
      });
    }

    document.addEventListener('keydown', e => {
      if ((e.key === 'n' || e.key === 'N') && !e.metaKey && !e.ctrlKey) {
        document.getElementById('notes').classList.toggle('open');
      }
    });

    // Touch swipe: navigate slides on mobile.
    let _tx = null, _ty = null;
    document.addEventListener('touchstart', e => {
      if (e.touches.length === 1) { _tx = e.touches[0].clientX; _ty = e.touches[0].clientY; }
    }, { passive: true });
    document.addEventListener('touchend', e => {
      if (_tx == null) return;
      const dx = e.changedTouches[0].clientX - _tx, dy = e.changedTouches[0].clientY - _ty;
      _tx = _ty = null;
      if (Math.abs(dx) > 48 && Math.abs(dx) > Math.abs(dy) * 1.5) show(idx + (dx < 0 ? 1 : -1));
    }, { passive: true });

    async function boot() {
      const id = new URLSearchParams(location.search).get('id');
      const state = document.getElementById('state');
      if (!id) { state.textContent = 'No deck id. Open this page from the admin Decks tab.'; return; }
      let deck = null;
      try { deck = await (await fetch(`${DB}/decks/${encodeURIComponent(id)}.json`)).json(); }
      catch (e) { /* handled below */ }
      if (!deck || !Array.isArray(deck.slides)) { state.textContent = 'Deck not found.'; return; }

      document.title = deck.title + ', UCSB AEC';
      const stage = document.getElementById('stage');
      stage.innerHTML = deck.slides.map(s => {
        let body = slideHtml(s, deck);
        if (s.type !== 'title' && s.kicker) body = `<div class="kicker">${esc(s.kicker)}</div>` + body;
        if (s.type !== 'title' && s.sub) body = body.replace('</h2>', `</h2><p class="subline">${esc(s.sub)}</p>`);
        if (s.src) body += `<div class="srcline">${esc(s.src)}</div>`;
        return `<section class="slide">${body}</section>`;
      }).join('');
      window._deckSlides = deck.slides;
      total = deck.slides.length;
      show(0);

      addEventListener('keydown', e => {
        if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') show(idx + 1);
        else if (e.key === 'ArrowLeft' || e.key === 'PageUp') show(idx - 1);
        else if (e.key === 'Home') show(0);
        else if (e.key === 'End') show(total - 1);
        else if (e.key.toLowerCase() === 'f') {
          document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
        }
      });
      // tap / click anywhere advances (left third goes back). On document so it
      // works in the small admin preview iframe, not just the slide area.
      document.addEventListener('click', e => {
        if (e.target.closest('a')) return;
        (e.clientX < innerWidth / 3) ? show(idx - 1) : show(idx + 1);
      });

      // Keyboard needs focus. In an iframe the parent has it, so make the
      // document focusable and grab focus on load and whenever it's clicked.
      document.body.tabIndex = -1;
      var grab = () => { try { window.focus(); document.body.focus(); } catch (e) {} };
      grab();
      document.addEventListener('mouseenter', grab);
      document.addEventListener('click', grab);
    }
    boot();
  </script>
</body>
</html>
