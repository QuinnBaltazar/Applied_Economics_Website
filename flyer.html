<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Flyer, UCSB AEC</title>
  <style>
    :root {
      --bg:#090F1A; --navy:#162438; --gold:#C4A448; --gold-lt:#D4B55E;
      --gold-dim:rgba(196,164,72,0.12); --text:#fff; --muted:rgba(255,255,255,0.72);
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background:#20293a; min-height:100vh; display:flex; align-items:center;
      justify-content:center; padding:28px;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif;
      color:var(--text);
    }
    .toolbar {
      position:fixed; top:14px; right:16px; display:flex; gap:10px; z-index:10;
    }
    .toolbar button, .toolbar a {
      background:rgba(9,15,26,0.9); color:#fff; border:1px solid rgba(196,164,72,0.5);
      border-radius:999px; padding:9px 18px; font:600 13px/1 inherit; cursor:pointer;
      text-decoration:none;
    }
    .toolbar button:hover, .toolbar a:hover { background:var(--gold); color:#111; }

    /* ── Poster: US Letter ── */
    .flyer.bold {
      width:816px; height:1056px;            /* 8.5x11in @ 96dpi */
      background:
        radial-gradient(900px 500px at 85% -10%, rgba(196,164,72,0.14), transparent 60%),
        radial-gradient(700px 500px at -10% 110%, rgba(43,74,111,0.5), transparent 55%),
        var(--bg);
      border:1px solid rgba(255,255,255,0.08);
      display:flex; flex-direction:column; padding:64px 60px;
      position:relative; overflow:hidden;
    }
    .crest {
      width:88px; height:88px; border-radius:50%;
      border:2px solid var(--gold); display:flex; align-items:center; justify-content:center;
      font-weight:800; font-size:30px; letter-spacing:1px; color:var(--gold-lt);
      background:rgba(9,15,26,0.6);
    }
    .club { margin-top:20px; color:var(--gold); font-weight:700; letter-spacing:.18em;
            text-transform:uppercase; font-size:15px; }
    .headline { margin-top:14px; font-size:64px; line-height:1.04; letter-spacing:-0.02em; font-weight:800; }
    .subhead { margin-top:14px; font-size:23px; color:var(--muted); }
    .hook { margin-top:30px; font-size:19px; line-height:1.5; color:rgba(255,255,255,0.85);
            border-left:4px solid var(--gold); padding-left:18px; max-width:56ch; }
    .bullets { margin-top:34px; list-style:none; display:flex; flex-direction:column; gap:15px; }
    .bullets li { position:relative; padding-left:30px; font-size:20px; font-weight:600; }
    .bullets li::before {
      content:""; position:absolute; left:0; top:.5em; width:15px; height:4px;
      background:var(--gold); border-radius:2px;
    }
    .spacer { flex:1; }
    .cta {
      background:var(--gold-dim); border:1px solid rgba(196,164,72,0.4);
      border-radius:16px; padding:20px 24px; font-size:21px; font-weight:700; line-height:1.35;
    }
    .bottom { margin-top:22px; display:flex; align-items:center; justify-content:space-between; gap:18px; }
    .footer-line { color:var(--muted); font-size:15px; }
    .site { color:var(--gold-lt); font-weight:800; font-size:19px; letter-spacing:.03em; }
    .qr { width:104px; height:104px; border-radius:12px; background:#fff; padding:7px; }

    /* ── Story: 1080x1920, scaled to fit ── */
    .flyer.story {
      width:1080px; height:1920px; transform-origin:center;
      background:
        radial-gradient(1000px 700px at 90% -5%, rgba(196,164,72,0.16), transparent 60%),
        radial-gradient(900px 700px at -10% 105%, rgba(43,74,111,0.55), transparent 55%),
        var(--bg);
      display:flex; flex-direction:column; padding:110px 88px; overflow:hidden;
    }
    .story .crest { width:130px; height:130px; font-size:44px; }
    .story .club { font-size:24px; margin-top:30px; }
    .story .headline { font-size:104px; margin-top:22px; }
    .story .subhead { font-size:36px; margin-top:22px; }
    .story .hook { font-size:32px; margin-top:44px; max-width:100%; }
    .story .bullets { margin-top:54px; gap:26px; }
    .story .bullets li { font-size:34px; padding-left:44px; }
    .story .bullets li::before { width:22px; height:6px; top:.55em; }
    .story .cta { font-size:36px; padding:34px 38px; border-radius:24px; }
    .story .bottom { margin-top:40px; }
    .story .footer-line { font-size:26px; }
    .story .site { font-size:32px; }
    .story .qr { width:170px; height:170px; border-radius:18px; }

    /* ── Identity & polish layer ── */
    .flyer { print-color-adjust: exact; -webkit-print-color-adjust: exact; position:relative; }
    .flyer.bold {
      background-image:
        linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px),
        radial-gradient(900px 500px at 85% -10%, rgba(196,164,72,0.16), transparent 60%),
        radial-gradient(700px 500px at -10% 110%, rgba(43,74,111,0.5), transparent 55%);
      background-size: 44px 44px, 44px 44px, auto, auto;
      background-color: var(--bg);
    }
    .ghost-monogram {
      position:absolute; top:-30px; right:-14px; font-family:Georgia,serif; font-weight:700;
      font-size:340px; line-height:1; color:transparent; pointer-events:none; user-select:none;
      -webkit-text-stroke:2px rgba(196,164,72,0.07);
    }
    .story .ghost-monogram { font-size:520px; top:-40px; }
    .chart-motif { position:absolute; left:0; right:0; bottom:0; width:100%; height:auto;
      pointer-events:none; opacity:0.9; }
    .kicker { display:inline-flex; align-items:center; gap:10px; margin-bottom:18px;
      color:var(--gold-lt); font-weight:800; letter-spacing:.22em; text-transform:uppercase; font-size:13px; }
    .kicker::before { content:""; width:34px; height:3px; background:var(--gold); border-radius:2px; }
    .story .kicker { font-size:22px; }
    .chips { display:flex; gap:9px; flex-wrap:wrap; margin-top:18px; position:relative; }
    .chips span { border:1px solid rgba(196,164,72,0.45); color:var(--gold-lt);
      border-radius:999px; padding:6px 13px; font-size:12.5px; font-weight:700;
      letter-spacing:.05em; text-transform:uppercase; background:rgba(196,164,72,0.07); }
    .story .chips span { font-size:21px; padding:10px 22px; }
    .flyer .headline { font-size:72px; letter-spacing:-0.03em; line-height:1.0; }
    .story .headline { font-size:110px; }
    .cta { background:var(--gold); border-color:var(--gold); color:#101B2C;
      box-shadow:0 14px 34px rgba(196,164,72,0.25); position:relative; }
    .cta::after { content:"\2192"; position:absolute; right:22px; top:50%; transform:translateY(-50%);
      font-size:1.25em; font-weight:800; }
    .bottom { border-top:1px solid rgba(196,164,72,0.3); padding-top:18px; position:relative; }
    .head-row, .hook, .bullets, .cta { position:relative; }

    /* ── Visual styles (orthogonal to poster/story format) ── */
    .flyer.style-classic {
      background:#F6F0E2;
      border:1px solid #D9CFB6;
      color:#101B2C;
    }
    .style-classic .crest { border-color:#101B2C; color:#101B2C; background:#EFE7D2; }
    .style-classic .club { color:#8C7326; }
    .style-classic .headline { font-family:Georgia,'Times New Roman',serif; color:#101B2C; letter-spacing:0; }
    .style-classic .subhead { color:#4A5568; }
    .style-classic .hook { color:#2A3648; border-left-color:#C4A448; }
    .style-classic .bullets li { color:#101B2C; }
    .style-classic .cta { background:#101B2C; border-color:#101B2C; color:#F6F0E2; }
    .style-classic .footer-line { color:#4A5568; }
    .style-classic .site { color:#8C7326; }
    .style-classic .qr { border:1px solid #D9CFB6; }
    .style-classic { background-image:none; }
    .style-classic .ghost-monogram { -webkit-text-stroke-color:rgba(16,27,44,0.06); }
    .style-classic .chart-motif path { stroke:#101B2C; opacity:.5; }
    .style-classic .chart-motif .area { fill:rgba(16,27,44,0.05); }
    .style-classic .chips span { border-color:#B7A968; color:#8C7326; background:rgba(140,115,38,0.07); }
    .style-classic .kicker { color:#8C7326; }
    .style-classic .cta { background:#101B2C; color:#F6F0E2; box-shadow:none; }
    .style-classic .bottom { border-top-color:#D9CFB6; }

    .flyer.style-grid { background:var(--bg); border-top:14px solid var(--gold); }
    .style-grid .crest { border-radius:14px; }
    .style-grid .headline { text-transform:uppercase; letter-spacing:0.01em; }
    .style-grid .hook { border-left:0; padding:16px 20px; background:rgba(255,255,255,0.05);
      border:1px solid rgba(255,255,255,0.1); border-radius:12px; }
    .style-grid .bullets li { border:1px solid rgba(196,164,72,0.3); border-radius:10px;
      padding:12px 16px 12px 40px; background:rgba(196,164,72,0.06); }
    .style-grid .bullets li::before { left:14px; }
    .style-grid .cta { background:var(--gold); border-color:var(--gold); color:#101B2C; }
    .style-grid.story .bullets li { padding:20px 24px 20px 62px; }
    .style-grid.story .bullets li::before { left:22px; }

    .head-row.pos-center { text-align:center; }
    .head-row.pos-center .crest { margin:0 auto; }
    .head-row.pos-right { text-align:right; }
    .head-row.pos-right .crest { margin-left:auto; }
    .head-row.pos-center .club, .head-row.pos-center .headline,
    .head-row.pos-center .subhead { text-align:center; }
    .head-row.pos-right .club, .head-row.pos-right .headline,
    .head-row.pos-right .subhead { text-align:right; }

    body.editing [contenteditable] { outline:1.5px dashed rgba(196,164,72,0.55); outline-offset:4px;
      border-radius:4px; min-width:24px; }
    body.editing [contenteditable]:focus { outline-style:solid; background:rgba(196,164,72,0.07); }
    .edit-panel {
      position:fixed; left:16px; top:14px; z-index:10; display:none;
      background:rgba(9,15,26,0.94); border:1px solid rgba(196,164,72,0.4);
      border-radius:14px; padding:14px 16px; width:230px; color:#fff; font-size:13px;
    }
    body.editing .edit-panel { display:block; }
    .edit-panel label { display:block; margin:10px 0 4px; color:rgba(255,255,255,0.6);
      font-size:11px; text-transform:uppercase; letter-spacing:.06em; }
    .edit-panel select { width:100%; padding:7px 9px; border-radius:7px;
      border:1px solid rgba(255,255,255,0.16); background:rgba(255,255,255,0.06); color:#fff; }
    .edit-panel .row { display:flex; align-items:center; gap:8px; margin-top:9px; }
    .bullet-tools { display:none; }
    body.editing .bullet-tools { display:inline-flex; gap:6px; margin-top:10px; }
    body.editing .bullets li .del-b {
      position:absolute; right:-30px; top:50%; transform:translateY(-50%);
      cursor:pointer; color:rgba(255,120,120,0.85); font-weight:700; font-size:15px;
    }
    .del-b { display:none; }
    body.editing .del-b { display:block; }
    .mini-btn { background:rgba(255,255,255,0.07); border:1px solid rgba(255,255,255,0.2);
      color:#fff; border-radius:7px; padding:6px 12px; font:600 12px/1 inherit; cursor:pointer; }
    .mini-btn:hover { border-color:var(--gold); }

    @media print {
      body { background:#fff; padding:0; }
      .toolbar { display:none; }
      .flyer.bold { border:0; }
      .flyer.style-classic { border:0; }
      @page { size:letter; margin:0; }
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <button id="btn-print">Print / Save PDF</button>
    <a id="btn-other" href="#">Switch format</a>
  </div>
  <div class="edit-panel">
    <div style="font-weight:700;font-size:14px">Design</div>
    <label for="ep-logo">Logo position</label>
    <select id="ep-logo"><option value="left">Left</option><option value="center">Center</option><option value="right">Right</option></select>
    <div class="row"><input type="checkbox" id="ep-crest" checked style="accent-color:#C4A448" /><label for="ep-crest" style="margin:0;text-transform:none;font-size:13px;color:#fff">Show logo</label></div>
    <div class="row"><input type="checkbox" id="ep-qr" checked style="accent-color:#C4A448" /><label for="ep-qr" style="margin:0;text-transform:none;font-size:13px;color:#fff">Show QR code</label></div>
    <div style="margin-top:12px;color:rgba(255,255,255,0.45);font-size:11.5px;line-height:1.45">
      Click any text on the flyer to edit it. Style and format pills up top are saved too.
    </div>
  </div>
  <div id="stage"><div style="color:rgba(255,255,255,0.6)">Loading flyer…</div></div>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="assets/auth.js"></script>
  <script>
    const DB = 'https://applied-economics-club-default-rtdb.firebaseio.com';
    const esc = s => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
                     .replace(/>/g,'&gt;').replace(/"/g,'&quot;');

    function render(f, template) {
      const qrUrl = 'https://api.qrserver.com/v1/create-qr-code/?size=600x600&data=' +
                    encodeURIComponent('https://www.ucsbaec.com');
      const pos = ['left','center','right'].includes(f.logoPos) ? f.logoPos : 'left';
      const crest = f.showCrest === false ? '' : '<div class="crest">AE</div>';
      const qr = f.showQr === false ? '' :
        `<img class="qr" src="${qrUrl}" alt="QR code to ucsbaec.com" onerror="this.style.display='none'" />`;
      const motif = `
        <div class="ghost-monogram" aria-hidden="true">AE</div>
        <svg class="chart-motif" viewBox="0 0 800 140" aria-hidden="true" preserveAspectRatio="none">
          <path class="area" d="M0,130 L90,112 L180,118 L270,88 L360,96 L470,60 L580,70 L690,34 L800,10 L800,140 L0,140 Z"
                fill="rgba(196,164,72,0.07)"/>
          <path d="M0,130 L90,112 L180,118 L270,88 L360,96 L470,60 L580,70 L690,34 L800,10"
                fill="none" stroke="rgba(196,164,72,0.5)" stroke-width="2.5"/>
          <circle cx="690" cy="34" r="5" fill="rgba(212,181,94,0.9)"/>
        </svg>`;
      return `
      <div class="flyer ${template}" id="flyer">
        ${motif}
        <div class="head-row pos-${pos}">
          ${crest}
          ${f.purpose ? `<div class="kicker">${esc(f.purpose)}</div>` : ''}
          <div class="club">UCSB Applied Economics Club</div>
          <h1 class="headline" data-f="headline">${esc(f.headline)}</h1>
          <div class="subhead" data-f="subhead">${esc(f.subhead||'')}</div>
          <div class="chips" aria-hidden="true">
            <span>Vote-driven topics</span><span>Industry speakers</span><span>Career tracks</span>
          </div>
        </div>
        <p class="hook" data-f="hook" ${f.hook?'':'style="display:none"'}>${esc(f.hook||'')}</p>
        <ul class="bullets" id="bullets">${(f.bullets||[]).map(b=>
          `<li><span data-f="bullet">${esc(b)}</span><span class="del-b" title="Remove">✕</span></li>`).join('')}</ul>
        <span class="bullet-tools"><button type="button" class="mini-btn" id="add-bullet">+ bullet</button></span>
        <div class="spacer"></div>
        <div class="cta" data-f="cta" ${f.cta?'':'style="display:none"'}>${esc(f.cta||'')}</div>
        <div class="bottom">
          <div>
            <div class="footer-line" data-f="footer">${esc(f.footer||'')}</div>
            <div class="site">ucsbaec.com</div>
          </div>
          ${qr}
        </div>
      </div>`;
    }

    function fitStory() {
      const el = document.getElementById('flyer');
      if (!el || !el.classList.contains('story')) { if (el) el.style.transform = ''; return; }
      const scale = Math.min((innerWidth - 56) / 1080, (innerHeight - 56) / 1920, 1);
      el.style.transform = `scale(${scale})`;
      el.style.margin = `${(1920 * scale - 1920) / 2}px ${(1080 * scale - 1080) / 2}px`;
    }

    async function boot() {
      const qs = new URLSearchParams(location.search);
      const id = qs.get('id');
      const stage = document.getElementById('stage');
      if (!id) { stage.innerHTML = '<div style="color:rgba(255,255,255,0.6)">No flyer id.</div>'; return; }
      let f = null;
      try { f = await (await fetch(`${DB}/flyers/${encodeURIComponent(id)}.json`)).json(); } catch (e) {}
      if (!f || !f.headline) { stage.innerHTML = '<div style="color:rgba(255,255,255,0.6)">Flyer not found.</div>'; return; }

      const template = ['bold','story'].includes(qs.get('template')) ? qs.get('template')
                     : (f.template === 'story' ? 'story' : 'bold');
      const styles = ['bold','classic','grid'];
      const style = styles.includes(qs.get('style')) ? qs.get('style') : (f.style || 'bold');
      document.title = f.headline + ', UCSB AEC flyer';
      stage.innerHTML = render(f, template + (style !== 'bold' ? ' style-' + style : ''));

      const other = template === 'bold' ? 'story' : 'bold';
      const link = document.getElementById('btn-other');
      link.textContent = other === 'story' ? 'Instagram story format' : 'Print poster format';
      link.href = `flyer.html?id=${encodeURIComponent(id)}&template=${other}&style=${style}`;

      // style switcher pills
      const bar = document.querySelector('.toolbar');
      styles.forEach(st => {
        if (st === style) return;
        const a = document.createElement('a');
        a.textContent = { bold:'Bold style', classic:'Classic style', grid:'Grid style' }[st];
        a.href = `flyer.html?id=${encodeURIComponent(id)}&template=${template}&style=${st}`;
        bar.appendChild(a);
      });
      document.getElementById('btn-print').addEventListener('click', () => print());

      // ── Edit mode (?edit=1): contenteditable text + design panel + Save ──
      if (qs.get('edit') === '1') {
        document.body.classList.add('editing');
        let dirty = false;
        const markDirty = () => { dirty = true; saveBtn.textContent = 'Save changes'; };

        document.querySelectorAll('[data-f]').forEach(el => {
          el.setAttribute('contenteditable', 'plaintext-only');
          el.style.display = '';                       // reveal empty optional fields
          el.addEventListener('input', markDirty);
        });
        document.getElementById('add-bullet').addEventListener('click', () => {
          const li = document.createElement('li');
          li.innerHTML = '<span data-f="bullet" contenteditable="plaintext-only">New reason to come</span>' +
                         '<span class="del-b" title="Remove">✕</span>';
          li.querySelector('[data-f]').addEventListener('input', markDirty);
          document.getElementById('bullets').appendChild(li);
          markDirty();
        });
        document.getElementById('bullets').addEventListener('click', e => {
          if (e.target.classList.contains('del-b')) { e.target.closest('li').remove(); markDirty(); }
        });

        const epLogo = document.getElementById('ep-logo');
        const epCrest = document.getElementById('ep-crest');
        const epQr = document.getElementById('ep-qr');
        epLogo.value = ['left','center','right'].includes(f.logoPos) ? f.logoPos : 'left';
        epCrest.checked = f.showCrest !== false;
        epQr.checked = f.showQr !== false;
        epLogo.addEventListener('change', () => {
          const hr = document.querySelector('.head-row');
          hr.className = 'head-row pos-' + epLogo.value; markDirty();
        });
        epCrest.addEventListener('change', () => {
          const c = document.querySelector('.crest');
          if (c) c.style.display = epCrest.checked ? '' : 'none'; markDirty();
        });
        epQr.addEventListener('change', () => {
          const q = document.querySelector('.qr');
          if (q) q.style.display = epQr.checked ? '' : 'none'; markDirty();
        });

        const bar = document.querySelector('.toolbar');
        const saveBtn = document.createElement('button');
        saveBtn.textContent = 'Save changes';
        saveBtn.style.borderColor = 'rgba(100,220,130,0.6)';
        bar.prepend(saveBtn);

        // keep pills inside edit mode
        bar.querySelectorAll('a').forEach(a => {
          if (a.href && !a.href.includes('edit=1')) a.href += '&edit=1';
        });

        saveBtn.addEventListener('click', async () => {
          const tok = window.AECAuth ? await AECAuth.token() : null;
          if (!tok) { alert('Sign in with your admin account first (signin.html), then come back.'); return; }
          const get = f2 => { const el = document.querySelector('[data-f="' + f2 + '"]'); return el ? el.innerText.trim() : ''; };
          const fields = {
            headline: get('headline'), subhead: get('subhead'), hook: get('hook'),
            cta: get('cta'), footer: get('footer'),
            bullets: [...document.querySelectorAll('[data-f="bullet"]')].map(el => el.innerText.trim()).filter(Boolean),
            style, template,
            logoPos: epLogo.value, showCrest: epCrest.checked, showQr: epQr.checked
          };
          if (!fields.headline) { alert('Headline cannot be empty.'); return; }
          saveBtn.disabled = true; saveBtn.textContent = 'Saving…';
          try {
            const r = await fetch('https://us-central1-applied-economics-club.cloudfunctions.net/updateFlyer', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + tok },
              body: JSON.stringify({ id, fields })
            });
            const d = await r.json().catch(() => ({}));
            if (r.status === 403 || r.status === 401) alert(d.error || 'Not authorised - sign in as an admin.');
            else if (!r.ok) alert(d.error || 'Save failed (' + r.status + ').');
            else { dirty = false; saveBtn.textContent = 'Saved ✓ (v' + d.version + ')'; }
          } catch (e) { alert('Could not reach the server.'); }
          finally { saveBtn.disabled = false; }
        });
        addEventListener('beforeunload', e => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });
      }

      fitStory();
      addEventListener('resize', fitStory);
    }
    boot();
  </script>
</body>
</html>
