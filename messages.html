<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
  <title>Messages | UCSB Applied Economics Club</title>
  <meta name="description" content="Direct messages between UCSB Applied Economics Club members." />
  <meta name="theme-color" content="#090F1A" />
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="assets/icon.svg" />
  <link rel="stylesheet" href="assets/styles.css" />
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="assets/auth.js"></script>
  <script src="assets/app.js" defer></script>
  <style>
    :root {
      --bg: #090F1A;
      --surface: #0E1829;
      --surface-soft: #12213A;
      --accent: #C4A448;
      --accent-soft: #D4B55E;
      --text: #FFFFFF;
      --border: rgba(255,255,255,0.08);
      --shadow: 0 24px 60px rgba(0,0,0,0.26);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); line-height: 1.6; }
    /* dvh tracks the on-screen keyboard on phones so the compose bar stays visible. */
    @supports (height: 100dvh) { html, body { height: 100dvh; } }

    /* ── NAV ── */
    .topbar {
      position: fixed; top: 0; left: 0; right: 0; width: 100%; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 clamp(20px, 4vw, 56px); height: 64px;
      background: rgba(9,15,26,0.84); backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      transition: background 0.35s, box-shadow 0.35s, border-color 0.35s;
      animation: navDown 0.5s cubic-bezier(0.4,0,0.2,1) both;
    }
    @keyframes navDown { from { transform: translateY(-100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .topbar.scrolled { background: rgba(9,15,26,0.98); box-shadow: 0 2px 38px rgba(0,0,0,0.42); border-color: rgba(196,164,72,0.15); }
    .brand { font-size: 0.85rem; font-weight: 800; color: #fff; letter-spacing: 0.2em; text-transform: uppercase; text-decoration: none; white-space: nowrap; flex-shrink: 0; transition: color 0.2s; }
    .brand:hover { color: var(--accent); }
    .main-nav { display: flex; align-items: center; gap: 2px; }
    .main-nav a { position: relative; display: inline-flex; align-items: center; gap: 5px; padding: 8px 13px; color: rgba(255,255,255,0.72); text-decoration: none; font-size: 0.875rem; font-weight: 500; letter-spacing: 0.03em; border-radius: 10px; transition: color 0.2s, background 0.2s; }
    .main-nav a::after { content: ''; position: absolute; bottom: 5px; left: 13px; right: 13px; height: 2px; background: var(--accent); border-radius: 2px; transform: scaleX(0); transition: transform 0.25s cubic-bezier(0.4,0,0.2,1); transform-origin: center; }
    .main-nav a:hover { color: #fff; background: rgba(255,255,255,0.08); }
    .main-nav a:hover::after, .main-nav a.active::after { transform: scaleX(1); }
    .main-nav a.active { color: #fff; font-weight: 700; background: rgba(196,164,72,0.12); }
    .nav-unread {
      display: inline-flex; align-items: center; justify-content: center;
      background: var(--accent); color: #031a40; font-size: 0.65rem; font-weight: 800;
      border-radius: 999px; min-width: 16px; height: 16px; padding: 0 4px; line-height: 1;
    }

    /* ── MOBILE NAV ── */
    .nav-toggle { display: none; flex-direction: column; justify-content: center; align-items: center; gap: 5px; width: 40px; height: 40px; background: none; border: none; cursor: pointer; padding: 8px; border-radius: 8px; transition: background .2s; flex-shrink: 0; }
    .nav-toggle:hover { background: rgba(255,255,255,.06); }
    .nav-toggle span { display: block; width: 22px; height: 2px; background: #fff; border-radius: 2px; transition: transform .25s, opacity .25s; transform-origin: center; }
    .nav-toggle.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
    .nav-toggle.open span:nth-child(2) { opacity: 0; transform: scaleX(0); }
    .nav-toggle.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }
    .brand-abbr { display: none; }
    @media (max-width: 640px) {
      .nav-toggle { display: flex; }
      .brand-full { display: none; }
      .brand-abbr { display: inline; }
      .main-nav { display: flex; flex-direction: column; position: absolute; top: 64px; left: 0; right: 0; background: rgba(9,15,26,.97); backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px); border-bottom: 1px solid rgba(196,164,72,.14); padding: 12px 16px 20px; gap: 4px; opacity: 0; transform: translateY(-6px); pointer-events: none; visibility: hidden; transition: opacity 0.22s, transform 0.22s, visibility 0s linear 0.22s; }
      .main-nav.open { opacity: 1; transform: translateY(0); pointer-events: auto; visibility: visible; transition: opacity 0.22s, transform 0.22s; }
      .main-nav a { padding: 12px 16px; font-size: 1rem; border-radius: 10px; }
    }

    /* ── PAGE SHELL ── */
    .page { height: 100%; padding-top: 64px; display: flex; flex-direction: column; max-width: 100%; }

    /* ── AUTH GATE ── */
    .auth-gate-wrap { flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .auth-gate { padding: 56px 44px; max-width: 480px; width: 100%; text-align: center; background: rgba(7,22,48,0.96); border: 1px solid rgba(255,255,255,0.1); border-radius: 28px; box-shadow: 0 26px 60px rgba(0,0,0,0.2); }
    .auth-gate-icon { font-size: 3rem; margin-bottom: 20px; display: block; }
    .auth-gate h2 { font-size: 1.8rem; margin-bottom: 12px; letter-spacing: -0.02em; }
    .auth-gate p { color: rgba(255,255,255,0.72); font-size: 0.97rem; line-height: 1.7; margin-bottom: 28px; }
    .auth-gate-btn { display: inline-flex; align-items: center; justify-content: center; padding: 14px 30px; border-radius: 999px; background: var(--accent); color: #031a40; font-weight: 700; font-size: 0.97rem; text-decoration: none; transition: transform 0.2s, filter 0.2s; }
    .auth-gate-btn:hover { transform: translateY(-2px); filter: brightness(1.06); }

    /* ── DM LAYOUT ── */
    .dm-outer { flex: 1; min-height: 0; overflow: hidden; padding: 16px 24px 24px; }
    .dm-wrap {
      height: 100%; display: flex; border-radius: 20px; overflow: hidden;
      border: 1px solid rgba(255,255,255,0.08); box-shadow: 0 24px 60px rgba(0,0,0,0.3);
    }

    /* ── INBOX PANEL ── */
    .inbox-panel {
      width: 300px; flex-shrink: 0; border-right: 1px solid rgba(255,255,255,0.08);
      display: flex; flex-direction: column; background: var(--surface); overflow: hidden;
    }
    .inbox-header { padding: 20px 20px 14px; font-size: 1.05rem; font-weight: 700; border-bottom: 1px solid rgba(255,255,255,0.06); flex-shrink: 0; letter-spacing: -0.01em; }
    .inbox-search-wrap { padding: 12px 12px 8px; position: relative; flex-shrink: 0; }
    .inbox-search {
      width: 100%; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px; color: #fff; padding: 9px 12px; font: inherit; font-size: 0.88rem;
      outline: none; transition: border-color 0.2s; -webkit-appearance: none;
    }
    .inbox-search:focus { border-color: var(--accent); }
    .inbox-search::placeholder { color: rgba(255,255,255,0.3); }
    .member-suggestions {
      display: none; position: absolute; top: calc(100% - 4px); left: 12px; right: 12px;
      background: #0c1628; border: 1px solid rgba(255,255,255,0.12); border-radius: 12px;
      overflow: hidden; z-index: 20; box-shadow: 0 12px 36px rgba(0,0,0,0.5);
      max-height: 60vh; overflow-y: auto;
    }
    .suggest-label { padding: 9px 14px 4px; font-size: 0.68rem; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(196,164,72,0.8); font-weight: 700; }
    .suggest-item { display: flex; align-items: center; gap: 10px; padding: 9px 14px; cursor: pointer; transition: background 0.15s; }
    .suggest-item:hover { background: rgba(255,255,255,0.06); }
    .suggest-avatar { width: 34px; height: 34px; border-radius: 50%; background: rgba(196,164,72,0.18); color: var(--accent); font-weight: 700; font-size: 0.78rem; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .suggest-info { flex: 1; min-width: 0; }
    .suggest-name { font-size: 0.9rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .suggest-sub { font-size: 0.74rem; color: rgba(255,255,255,0.5); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .suggest-empty { padding: 14px; font-size: 0.84rem; color: rgba(255,255,255,0.45); text-align: center; }
    .conv-list { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    .conv-list::-webkit-scrollbar { width: 4px; }
    .conv-list::-webkit-scrollbar-track { background: transparent; }
    .conv-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }
    .conv-item { display: flex; align-items: center; gap: 12px; padding: 13px 16px; cursor: pointer; transition: background 0.15s; border-bottom: 1px solid rgba(255,255,255,0.04); }
    .conv-item:hover { background: rgba(255,255,255,0.04); }
    .conv-item.active { background: rgba(196,164,72,0.08); border-right: 2px solid var(--accent); }
    .conv-avatar { width: 42px; height: 42px; border-radius: 50%; background: rgba(196,164,72,0.18); color: var(--accent); font-weight: 700; font-size: 0.88rem; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .conv-info { flex: 1; min-width: 0; }
    .conv-name-row { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
    .conv-name { font-weight: 600; font-size: 0.92rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .conv-time { font-size: 0.7rem; color: rgba(255,255,255,0.48); flex-shrink: 0; }
    .conv-preview-row { display: flex; align-items: center; justify-content: space-between; gap: 6px; margin-top: 2px; }
    .conv-preview { font-size: 0.79rem; color: rgba(255,255,255,0.52); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .conv-name.unread { font-weight: 800; color: #fff; }
    .conv-preview.unread { color: rgba(255,255,255,0.75); }
    .conv-preview-you { color: rgba(196,164,72,0.7); }
    .unread-badge { background: var(--accent); color: #031a40; font-size: 0.66rem; font-weight: 800; border-radius: 999px; padding: 2px 7px; flex-shrink: 0; }
    .conv-empty { padding: 36px 20px; text-align: center; color: rgba(255,255,255,0.48); font-size: 0.87rem; line-height: 1.7; }

    /* ── THREAD PANEL ── */
    .thread-panel { flex: 1; display: flex; flex-direction: column; background: rgba(7,22,48,0.97); min-width: 0; }
    .thread-empty { flex: 1; overflow-y: auto; padding: 36px 40px; }
    .thread-empty h3 { font-size: 1.15rem; letter-spacing: -0.01em; margin-bottom: 4px; }
    .thread-empty > p { font-size: 0.88rem; color: rgba(255,255,255,0.5); margin-bottom: 22px; }
    .people-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
    .person-card {
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px;
      padding: 16px; cursor: pointer; transition: transform 0.2s, border-color 0.2s, background 0.2s;
      animation: cardIn 0.4s cubic-bezier(0.4,0,0.2,1) both;
    }
    .person-card:hover { transform: translateY(-3px); border-color: rgba(196,164,72,0.4); background: rgba(196,164,72,0.06); }
    @keyframes cardIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .person-top { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .person-name { font-weight: 700; font-size: 0.92rem; line-height: 1.3; }
    .person-year { font-size: 0.72rem; color: rgba(255,255,255,0.45); }
    .person-field { font-size: 0.8rem; color: rgba(255,255,255,0.7); line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .person-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
    .tag { font-size: 0.68rem; padding: 3px 8px; border-radius: 999px; background: rgba(196,164,72,0.12); color: var(--accent-soft); white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
    .thread-active { display: none; flex-direction: column; flex: 1; min-height: 0; }
    .thread-header { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-bottom: 1px solid rgba(255,255,255,0.07); flex-shrink: 0; background: rgba(7,22,48,0.99); }
    .back-btn { display: none; background: none; border: none; color: var(--accent); font-size: 1.35rem; cursor: pointer; padding: 4px 8px; border-radius: 8px; flex-shrink: 0; line-height: 1; }
    .thread-header-avatar { width: 38px; height: 38px; border-radius: 50%; background: rgba(196,164,72,0.18); color: var(--accent); font-weight: 700; font-size: 0.85rem; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .thread-header-name { font-weight: 700; font-size: 1rem; line-height: 1.3; }
    .thread-header-sub { font-size: 0.74rem; color: rgba(255,255,255,0.5); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 60vw; }
    .thread-messages { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 16px 20px; display: flex; flex-direction: column; }
    .thread-messages::-webkit-scrollbar { width: 4px; }
    .thread-messages::-webkit-scrollbar-track { background: transparent; }
    .thread-messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 4px; }
    .thread-no-msgs { text-align: center; color: rgba(255,255,255,0.28); font-size: 0.88rem; padding: 48px 0; align-self: center; }
    .msg-sep { text-align: center; font-size: 0.68rem; color: rgba(255,255,255,0.35); margin: 14px 0 8px; }
    .msg-row { display: flex; margin-bottom: 2px; }
    .msg-row.mine { justify-content: flex-end; }
    .msg-row.theirs { justify-content: flex-start; }
    .msg-row.gap { margin-top: 8px; }
    .msg-bubble { max-width: 72%; padding: 8px 14px; border-radius: 18px; animation: bubbleIn 0.18s ease-out both; }
    @keyframes bubbleIn { from { opacity: 0; transform: translateY(4px) scale(0.98); } to { opacity: 1; transform: none; } }
    .msg-bubble.mine { background: var(--accent); color: #0b1424; border-bottom-right-radius: 5px; }
    .msg-bubble.theirs { background: rgba(255,255,255,0.1); color: #fff; border-bottom-left-radius: 5px; }
    .msg-row.mine.last .msg-bubble { border-bottom-right-radius: 18px; }
    .msg-row.theirs.last .msg-bubble { border-bottom-left-radius: 18px; }
    .msg-row.pending .msg-bubble { opacity: 0.6; }
    .msg-text { font-size: 0.94rem; line-height: 1.45; word-break: break-word; white-space: pre-wrap; }
    .thread-compose {
      display: flex; gap: 8px; align-items: flex-end; padding: 10px 16px;
      padding-bottom: calc(10px + env(safe-area-inset-bottom));
      border-top: 1px solid rgba(255,255,255,0.07); background: rgba(7,22,48,0.99); flex-shrink: 0;
    }
    .compose-input {
      flex: 1; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14); border-radius: 20px;
      color: #fff; padding: 10px 15px; font: inherit; font-size: 0.94rem; resize: none; outline: none;
      transition: border-color 0.2s, height 0.12s ease-out; min-height: 42px; max-height: 140px; overflow-y: auto; line-height: 1.45;
      -webkit-appearance: none;
    }
    .compose-input::placeholder { color: rgba(255,255,255,0.3); }
    .compose-input:focus { border-color: var(--accent); }
    .compose-send {
      width: 42px; height: 42px; border-radius: 50%; border: none; background: var(--accent); color: #0b1424;
      font-size: 1.2rem; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: transform 0.15s, opacity 0.15s; flex-shrink: 0;
    }
    .compose-send:hover { transform: scale(1.06); }
    .compose-send:disabled { opacity: 0.35; transform: none; cursor: default; }

    /* ── MOBILE ── */
    @media (max-width: 640px) {
      .dm-outer { padding: 0; }
      .dm-wrap { border-radius: 0; border: none; border-top: 1px solid rgba(255,255,255,0.08); }
      .inbox-panel { width: 100%; }
      .thread-panel { display: none; width: 100%; }
      .dm-wrap.thread-open .inbox-panel { display: none; }
      .dm-wrap.thread-open .thread-panel { display: flex; }
      .back-btn { display: flex; align-items: center; justify-content: center; }
      .thread-messages { padding: 12px 12px; }
      .thread-compose { padding: 8px 10px; padding-bottom: calc(8px + env(safe-area-inset-bottom)); }
      .msg-bubble { max-width: 82%; }
      /* 16px stops iOS from zooming the page when a field is focused. */
      .compose-input, .inbox-search { font-size: 16px; }
      .thread-empty { padding: 20px 16px; }
    }
  </style>
</head>
<body>
  <header class="topbar" id="topbar">
    <a class="brand" href="index.html"><span class="brand-full">UCSB Applied Economics Club</span><span class="brand-abbr">UCSB&nbsp;AEC</span></a>
    <button class="nav-toggle" id="nav-toggle" aria-label="Toggle menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <nav class="main-nav" id="main-nav">
      <a href="index.html">Home</a>
      <a href="vote.html">Vote</a>
      <a href="topics.html">Tracks</a>
      <a href="members.html" id="members-nav-link" data-auth="member">Members</a>
      <a href="messages.html" id="messages-nav-link" data-auth="member">Messages <span class="nav-unread" id="nav-unread-badge" style="display:none"></span></a>
      <a href="board.html">Board</a>
      <a href="signin.html">Sign In</a>
      <a href="admin.html" id="admin-nav-link" data-auth="admin">Admin</a>
    </nav>
  </header>

  <main class="page">
    <!-- Not signed in -->
    <div id="auth-gate" style="display:none;">
      <div class="auth-gate-wrap">
        <div class="auth-gate">
          <span class="auth-gate-icon">&#128274;</span>
          <h2>Members Only</h2>
          <p>Sign in with your UCSB email to access member-to-member messaging.</p>
          <a href="signin.html" class="auth-gate-btn">Sign In to Continue</a>
        </div>
      </div>
    </div>

    <!-- DM UI -->
    <div id="dm-content" style="display:none; flex:1; flex-direction:column; min-height:0;">
      <div class="dm-outer">
        <div class="dm-wrap" id="dm-wrap">

          <!-- Left: Inbox -->
          <div class="inbox-panel">
            <div class="inbox-header">Messages</div>
            <div class="inbox-search-wrap">
              <input type="search" class="inbox-search" id="inbox-search" placeholder="Search by name, interest, or industry&hellip;" autocomplete="off" />
              <div class="member-suggestions" id="member-suggestions"></div>
            </div>
            <div class="conv-list" id="conv-list">
              <div aria-hidden="true" style="padding:6px">
                <div class="skel-row"><div class="skel" style="width:45%;height:14px"></div><div class="skel" style="width:80%"></div></div>
                <div class="skel-row"><div class="skel" style="width:45%;height:14px"></div><div class="skel" style="width:80%"></div></div>
              </div>
            </div>
          </div>

          <!-- Right: Thread -->
          <div class="thread-panel">
            <div class="thread-empty" id="thread-empty">
              <h3>People to meet</h3>
              <p>Members whose interests line up with yours. Tap one to say hi.</p>
              <div class="people-grid" id="people-grid"></div>
            </div>
            <div class="thread-active" id="thread-active">
              <div class="thread-header" id="thread-header"></div>
              <div class="thread-messages" id="thread-messages"></div>
              <div class="thread-compose">
                <textarea class="compose-input" id="compose-input" placeholder="iMessage-style: Enter sends, Shift+Enter for a new line" rows="1" maxlength="2000" enterkeyhint="send"></textarea>
                <button class="compose-send" id="compose-send" aria-label="Send" disabled>&#8593;</button>
              </div>
            </div>
          </div>

        </div>
      </div>
    </div>
  </main>

  <script>
    const DB_URL      = 'https://applied-economics-club-default-rtdb.firebaseio.com';
    const ADMIN_EMAIL = 'quinnbaltazar@ucsb.edu';
    const THREAD_POLL_MS = 4000;
    const INBOX_POLL_MS  = 15000;
    const PAGE_SIZE      = 60;      // messages loaded when a thread opens

    // ── Helpers ───────────────────────────────────────────────────────────────
    const eKey    = e => String(e).replace(/[.@#$[\]/]/g, '_');
    const convId  = (a, b) => [eKey(a), eKey(b)].sort().join('__');
    const esc     = s => String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    const initials = n => (n || '?').trim().split(/\s+/).map(w => w[0] || '').join('').slice(0, 2).toUpperCase();
    function fmtTime(ts) {
      if (!ts) return '';
      const d = new Date(ts), now = new Date(), diff = Date.now() - ts;
      if (diff < 86400000 && d.getDate() === now.getDate()) return d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
      if (diff < 7 * 86400000) return d.toLocaleDateString('en-US', { weekday: 'short' });
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    }
    function fmtSep(ts) {
      const d = new Date(ts), now = new Date();
      const sameDay = d.toDateString() === now.toDateString();
      const time = d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
      if (sameDay) return 'Today ' + time;
      if (Date.now() - ts < 7 * 86400000) return d.toLocaleDateString('en-US', { weekday: 'short' }) + ' ' + time;
      return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + ' ' + time;
    }

    // ── Firebase REST (auth.js appends the id token to every call) ────────────
    async function fbGet(p, q) {
      // null = node is empty, undefined = request failed
      try { const r = await fetch(`${DB_URL}/${p}.json${q ? '?' + q : ''}`); return r.ok ? r.json() : undefined; }
      catch { return undefined; }
    }
    async function fbSet(p, d)   { try { await fetch(`${DB_URL}/${p}.json`, { method: 'PUT',   headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(d) }); } catch {} }
    async function fbPatch(p, d) { try { await fetch(`${DB_URL}/${p}.json`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(d) }); } catch {} }
    async function fbPost(p, d)  { try { const r = await fetch(`${DB_URL}/${p}.json`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(d) }); return r.ok ? r.json() : null; } catch { return null; } }
    const q = (o) => Object.entries(o).map(([k, v]) => k + '=' + encodeURIComponent(JSON.stringify(v))).join('&');

    // ── Session ───────────────────────────────────────────────────────────────
    const SESSION_TTL = 30 * 24 * 60 * 60 * 1000;
    function getSession() { try { const s = JSON.parse(localStorage.getItem('aec-session')); if (!s) return null; if (s.loginAt && Date.now() - s.loginAt > SESSION_TTL) { localStorage.removeItem('aec-session'); return null; } return s; } catch { return null; } }
    const isAdminSess = s => s && (s.email === ADMIN_EMAIL || s.isAdmin === true);

    // ── State ─────────────────────────────────────────────────────────────────
    let me = null, myKey = '', myMember = null;
    let members = [];                       // everyone except me
    const memberByEmail = new Map();
    let activeConv = null;                  // { id, partnerEmail, partnerName, msgs:[], lastAt }
    let threadTimer = null, inboxTimer = null;
    let indexed = true;                     // false once an orderBy query is refused

    // ── Inbox: shallow key list, then only MY conversations' meta ─────────────
    // /dms.json?shallow=true returns just the conversation ids (a few bytes
    // each). Ids are "<keyA>__<keyB>", so membership is known without reading
    // anything else. Message bodies are never downloaded for the inbox.
    async function loadConversations() {
      const keys = await fbGet('dms', 'shallow=true');
      const mine = Object.keys(keys || {}).filter(id => id.split('__').includes(myKey));
      const metas = await Promise.all(mine.map(id => fbGet(`dms/${id}/meta`)));
      return mine
        .map((id, i) => ({ id, ...(metas[i] || {}) }))
        .filter(c => Array.isArray(c.participants))
        .sort((a, b) => (b.lastAt || 0) - (a.lastAt || 0));
    }

    function renderConvList(convs) {
      const list = document.getElementById('conv-list');
      list.innerHTML = '';
      if (!convs.length) {
        list.innerHTML = '<div class="conv-empty">No conversations yet.<br>Search above to find someone to message.</div>';
        return;
      }
      for (const conv of convs) {
        const partnerEmail = conv.participants.find(e => e !== me.email) || '';
        const partnerName  = (conv.names && conv.names[eKey(partnerEmail)]) || partnerEmail || 'Member';
        const unread       = conv['unread_' + myKey] || 0;
        const isMine       = conv.lastFrom === me.email;
        const item = document.createElement('div');
        item.className = 'conv-item' + (activeConv && conv.id === activeConv.id ? ' active' : '');
        item.dataset.conv = conv.id;
        item.innerHTML =
          '<div class="conv-avatar">' + esc(initials(partnerName)) + '</div>' +
          '<div class="conv-info">' +
            '<div class="conv-name-row"><span class="conv-name' + (unread ? ' unread' : '') + '">' + esc(partnerName) + '</span><span class="conv-time">' + esc(fmtTime(conv.lastAt)) + '</span></div>' +
            '<div class="conv-preview-row"><span class="conv-preview' + (unread ? ' unread' : '') + '">' + (isMine ? '<span class="conv-preview-you">You: </span>' : '') + esc((conv.lastMsg || '').slice(0, 60)) + '</span>' +
            (unread ? '<span class="unread-badge">' + unread + '</span>' : '') + '</div>' +
          '</div>';
        item.addEventListener('click', () => openConversation(partnerEmail, partnerName));
        list.appendChild(item);
      }
    }

    async function refreshInbox() {
      if (document.hidden) return;
      const convs = await loadConversations();
      renderConvList(convs);
      const total = convs.reduce((s, c) => s + (c['unread_' + myKey] || 0), 0);
      const badge = document.getElementById('nav-unread-badge');
      if (badge) { badge.textContent = total; badge.style.display = total > 0 ? 'inline-flex' : 'none'; }
    }

    // ── Thread ────────────────────────────────────────────────────────────────
    async function openConversation(partnerEmail, partnerName) {
      if (!partnerEmail) return;
      const id = convId(me.email, partnerEmail);
      const partnerKey = eKey(partnerEmail);
      activeConv = { id, partnerEmail, partnerName, partnerKey, msgs: [], lastAt: 0 };

      const meta = await fbGet(`dms/${id}/meta`);
      if (!meta) {
        await fbSet(`dms/${id}/meta`, {
          participants: [me.email, partnerEmail],
          names: { [myKey]: me.name || 'Member', [partnerKey]: partnerName },
          lastMsg: '', lastAt: 0,
          ['unread_' + myKey]: 0, ['unread_' + partnerKey]: 0
        });
      } else {
        markRead(id);
      }

      const partner = memberByEmail.get(partnerEmail);
      const sub = partner ? [partner.gradYear, partner.field || partner.subject].filter(Boolean).join(' · ') : '';
      document.getElementById('thread-empty').style.display = 'none';
      document.getElementById('thread-active').style.display = 'flex';
      document.getElementById('thread-header').innerHTML =
        '<button class="back-btn" id="back-btn" aria-label="Back">&#8249;</button>' +
        '<div class="thread-header-avatar">' + esc(initials(partnerName)) + '</div>' +
        '<div style="min-width:0"><div class="thread-header-name">' + esc(partnerName) + '</div>' +
        (sub ? '<div class="thread-header-sub">' + esc(sub) + '</div>' : '') + '</div>';
      document.getElementById('back-btn').addEventListener('click', () => {
        document.getElementById('dm-wrap').classList.remove('thread-open');
        activeConv = null; clearInterval(threadTimer);
        refreshInbox();
      });
      document.getElementById('dm-wrap').classList.add('thread-open');
      document.querySelectorAll('.conv-item').forEach(el => el.classList.toggle('active', el.dataset.conv === id));

      await loadThread(true);
      // Phones: focusing here pops the keyboard before the user taps; let them tap.
      if (window.matchMedia('(min-width: 641px)').matches) document.getElementById('compose-input').focus();

      clearInterval(threadTimer);
      threadTimer = setInterval(() => loadThread(false), THREAD_POLL_MS);
    }

    function markRead(id) {
      return fbPatch(`dms/${id}/meta`, { ['unread_' + myKey]: 0, ['emailReminderAt_' + myKey]: null });
    }

    // initial: last PAGE_SIZE messages. poll: only messages newer than what we
    // have (minus a minute of slack for clock skew; dedupe handles overlap).
    async function loadThread(initial) {
      const conv = activeConv;
      if (!conv || (!initial && document.hidden)) return;
      const query = initial
        ? q({ orderBy: 'at', limitToLast: PAGE_SIZE })
        : q({ orderBy: 'at', startAt: Math.max(0, conv.lastAt - 60000) });
      let raw = indexed ? await fbGet(`dms/${conv.id}/messages`, query) : undefined;
      if (raw === undefined) {
        // Indexed query refused (rules not deployed yet): fall back to a full read.
        indexed = false;
        raw = await fbGet(`dms/${conv.id}/messages`);
      }
      if (activeConv !== conv) return;   // user switched threads mid-request
      const incoming = Object.entries(raw || {}).map(([key, v]) => ({ key, ...v }));
      if (!initial && !incoming.some(m => !conv.msgs.some(x => x.key === m.key))) return;

      const have = new Map(conv.msgs.filter(m => !m.pending).map(m => [m.key, m]));
      incoming.forEach(m => have.set(m.key, m));
      const pending = conv.msgs.filter(m => m.pending);
      conv.msgs = [...have.values(), ...pending].sort((a, b) => (a.at || 0) - (b.at || 0));
      conv.lastAt = conv.msgs.reduce((t, m) => Math.max(t, m.at || 0), 0);
      renderThread(conv.msgs);

      if (!initial && incoming.some(m => m.from !== me.email)) markRead(conv.id);
    }

    function renderThread(msgs) {
      const feed = document.getElementById('thread-messages');
      const atBottom = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 80;
      feed.innerHTML = '';
      if (!msgs.length) {
        feed.innerHTML = '<div class="thread-no-msgs">No messages yet, say hello!</div>';
        return;
      }
      let prev = null;
      msgs.forEach((m, i) => {
        const gap = !prev || (m.at - prev.at) > 5 * 60000;
        if (gap) feed.insertAdjacentHTML('beforeend', '<div class="msg-sep">' + esc(fmtSep(m.at)) + '</div>');
        const isMine = m.from === me.email;
        const next = msgs[i + 1];
        const last = !next || next.from !== m.from || (next.at - m.at) > 5 * 60000;
        const row = document.createElement('div');
        row.className = 'msg-row ' + (isMine ? 'mine' : 'theirs') + (last ? ' last' : '') + (m.pending ? ' pending' : '') + (!gap && prev && prev.from !== m.from ? ' gap' : '');
        row.innerHTML = '<div class="msg-bubble ' + (isMine ? 'mine' : 'theirs') + '"><div class="msg-text">' + esc(m.body) + '</div></div>';
        feed.appendChild(row);
        prev = m;
      });
      if (atBottom || msgs.length <= 3) feed.scrollTop = feed.scrollHeight;
    }

    async function sendMessage() {
      const conv = activeConv;
      const input = document.getElementById('compose-input');
      const body = input.value.trim();
      if (!conv || !body) return;

      input.value = ''; autosize(input);
      document.getElementById('compose-send').disabled = true;

      // Show it immediately, then confirm with the server.
      const at = Date.now();
      const tmp = { key: 'tmp-' + at, from: me.email, fromName: me.name || 'Member', body, at, pending: true };
      conv.msgs.push(tmp); renderThread(conv.msgs);

      const res = await fbPost(`dms/${conv.id}/messages`, { from: tmp.from, fromName: tmp.fromName, body, at });
      if (activeConv === conv) {
        if (res && res.name) { tmp.key = res.name; delete tmp.pending; }
        else { conv.msgs = conv.msgs.filter(m => m !== tmp); }
        conv.lastAt = Math.max(conv.lastAt, at);
        renderThread(conv.msgs);
      }
      if (!res) return;

      // PATCH only what changed; the server increments the partner's unread
      // count atomically so two people sending at once can't clobber it.
      await fbPatch(`dms/${conv.id}/meta`, {
        lastMsg: body.slice(0, 80), lastFrom: me.email, lastAt: at,
        ['unread_' + myKey]: 0,
        ['unread_' + conv.partnerKey]: { '.sv': { increment: 1 } }
      });
      refreshInbox();
    }

    // ── Compose box: grows like iMessage, Enter sends ─────────────────────────
    function autosize(el) {
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 140) + 'px';
      document.getElementById('compose-send').disabled = !el.value.trim();
    }

    // ── Members: search + suggestions by interest / industry ──────────────────
    const words = s => String(s || '').toLowerCase().split(/[^a-z]+/).filter(w => w.length > 3);
    const STOP = new Set(['want', 'would', 'like', 'work', 'with', 'about', 'that', 'this', 'into', 'learn', 'more', 'career']);
    function similarity(a, b) {
      const A = new Set([...words(a.field), ...words(a.subject), ...words(a.goal), ...words(a.learn)].filter(w => !STOP.has(w)));
      const B = new Set([...words(b.field), ...words(b.subject), ...words(b.goal), ...words(b.learn)].filter(w => !STOP.has(w)));
      let n = 0; A.forEach(w => { if (B.has(w)) n++; });
      return n;
    }
    function suggestedMembers(limit) {
      const scored = members.map(m => ({ m, s: myMember ? similarity(myMember, m) : 0 }));
      scored.sort((x, y) => y.s - x.s || (y.m.joinedAt || 0) - (x.m.joinedAt || 0));
      return scored.slice(0, limit).map(x => x.m);
    }
    const memberBlurb = m => m.field || m.subject || m.goal || '';
    const memberTags  = m => [m.subject, m.goal].flatMap(s => String(s || '').split(/,|\band\b/)).map(s => s.trim()).filter(s => s && s.length < 28).slice(0, 3);

    function renderSuggestions(list, label) {
      const box = document.getElementById('member-suggestions');
      box.innerHTML = label ? '<div class="suggest-label">' + esc(label) + '</div>' : '';
      if (!list.length) box.innerHTML += '<div class="suggest-empty">No members match that.</div>';
      for (const m of list) {
        const item = document.createElement('div');
        item.className = 'suggest-item';
        item.innerHTML =
          '<span class="suggest-avatar">' + esc(initials(m.name)) + '</span>' +
          '<span class="suggest-info"><div class="suggest-name">' + esc(m.name) + '</div><div class="suggest-sub">' + esc(memberBlurb(m)) + '</div></span>';
        item.addEventListener('mousedown', e => e.preventDefault());   // keep input focus
        item.addEventListener('click', () => { hideSuggestions(); document.getElementById('inbox-search').value = ''; openConversation(m.email, m.name); });
        box.appendChild(item);
      }
      box.style.display = 'block';
    }
    function hideSuggestions() { document.getElementById('member-suggestions').style.display = 'none'; }

    function renderPeopleGrid() {
      const grid = document.getElementById('people-grid');
      grid.innerHTML = '';
      suggestedMembers(6).forEach((m, i) => {
        const card = document.createElement('div');
        card.className = 'person-card';
        card.style.animationDelay = (i * 50) + 'ms';
        card.innerHTML =
          '<div class="person-top"><span class="suggest-avatar">' + esc(initials(m.name)) + '</span>' +
          '<div><div class="person-name">' + esc(m.name) + '</div>' + (m.gradYear ? '<div class="person-year">Class of ' + esc(m.gradYear) + '</div>' : '') + '</div></div>' +
          '<div class="person-field">' + esc(memberBlurb(m)) + '</div>' +
          '<div class="person-tags">' + memberTags(m).map(t => '<span class="tag">' + esc(t) + '</span>').join('') + '</div>';
        card.addEventListener('click', () => openConversation(m.email, m.name));
        grid.appendChild(card);
      });
    }

    async function loadMembers() {
      const raw = await fbGet('members');
      const byEmail = new Map();
      Object.values(raw || {}).filter(m => m && m.name && m.email).forEach(m => {
        const prev = byEmail.get(m.email);
        if (!prev || (m.joinedAt || Infinity) < (prev.joinedAt || Infinity)) byEmail.set(m.email, m);
      });
      myMember = byEmail.get(me.email) || null;
      byEmail.delete(me.email);
      members = [...byEmail.values()].sort((a, b) => (a.name || '').localeCompare(b.name || ''));
      members.forEach(m => memberByEmail.set(m.email, m));

      const input = document.getElementById('inbox-search');
      const search = () => {
        const term = input.value.trim().toLowerCase();
        if (!term) return renderSuggestions(suggestedMembers(6), 'Suggested for you');
        const hits = members.filter(m => [m.name, m.email, m.field, m.subject, m.goal, m.learn].join(' ').toLowerCase().includes(term)).slice(0, 8);
        renderSuggestions(hits, '');
      };
      input.addEventListener('input', search);
      input.addEventListener('focus', search);
      document.addEventListener('click', e => { if (!e.target.closest('.inbox-search-wrap')) hideSuggestions(); });
      renderPeopleGrid();
    }

    // ── Boot ──────────────────────────────────────────────────────────────────
    document.addEventListener('DOMContentLoaded', async () => {
      const page = location.pathname.split('/').pop() || 'index.html';
      document.querySelectorAll('.main-nav a').forEach(a => a.classList.toggle('active', a.getAttribute('href') === page));

      me = getSession();
      if (!me) { document.getElementById('auth-gate').style.display = 'block'; return; }
      myKey = eKey(me.email);

      document.getElementById('members-nav-link').style.display = 'inline-flex';
      document.getElementById('messages-nav-link').style.display = 'inline-flex';
      const sl = document.querySelector('.main-nav a[href="signin.html"]'); if (sl) sl.textContent = 'Profile';
      if (isAdminSess(me)) document.getElementById('admin-nav-link').style.display = 'inline-flex';
      document.getElementById('dm-content').style.display = 'flex';

      await Promise.all([loadMembers(), refreshInbox()]);

      // ?with=email from a member card's "Message" button
      const withParam = new URLSearchParams(location.search).get('with');
      if (withParam) {
        const partner = memberByEmail.get(withParam);
        await openConversation(withParam, partner ? partner.name : withParam);
      }

      inboxTimer = setInterval(refreshInbox, INBOX_POLL_MS);
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) return;
        refreshInbox();
        if (activeConv) loadThread(false);
      });

      const input = document.getElementById('compose-input');
      document.getElementById('compose-send').addEventListener('click', sendMessage);
      input.addEventListener('input', () => autosize(input));
      input.addEventListener('keydown', e => {
        if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendMessage(); }
      });
      // Keep the latest message in view when the phone keyboard opens.
      input.addEventListener('focus', () => setTimeout(() => { const f = document.getElementById('thread-messages'); f.scrollTop = f.scrollHeight; }, 250));
    });
  </script>
</body>
</html>
