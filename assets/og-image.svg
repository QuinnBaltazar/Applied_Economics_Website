<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" preserveAspectRatio="xMidYMid meet">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%"   stop-color="#162438"/>
      <stop offset="60%"  stop-color="#0E1829"/>
      <stop offset="100%" stop-color="#090F1A"/>
    </radialGradient>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="40%">
      <stop offset="0%"   stop-color="#C4A448" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#C4A448" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bgGlow)"/>
  <circle cx="600" cy="315" r="320" fill="url(#goldGlow)"/>

  <!-- Rings -->
  <circle cx="600" cy="315" r="170" fill="none" stroke="#C4A448" stroke-opacity="0.10" stroke-width="1"/>
  <circle cx="600" cy="315" r="220" fill="none" stroke="#C4A448" stroke-opacity="0.07" stroke-width="1"/>
  <circle cx="600" cy="315" r="280" fill="none" stroke="#2B4A6F" stroke-opacity="0.18" stroke-width="1"/>

  <!-- Seal -->
  <g transform="translate(180,235) scale(0.62)">
    <circle cx="130" cy="130" r="124" fill="#F2EDE3"/>
    <circle cx="130" cy="130" r="124" fill="none" stroke="#2B4A6F" stroke-width="3.5"/>
    <text x="130" y="163" text-anchor="middle"
          font-family="Georgia, 'Times New Roman', serif"
          font-size="94" font-weight="900"
          fill="#2B4A6F" letter-spacing="-6">AE</text>
    <polyline points="70,168 86,178 116,146 135,155 183,101"
              stroke="#C4A448" stroke-width="2.5" fill="none"
              stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Wordmark -->
  <text x="430" y="305"
        font-family="Inter, system-ui, sans-serif"
        font-size="64" font-weight="800" fill="#FFFFFF" letter-spacing="-2">
    Applied Economics
  </text>
  <text x="430" y="375"
        font-family="Inter, system-ui, sans-serif"
        font-size="64" font-weight="800" fill="#C4A448" letter-spacing="-2">
    Club
  </text>
  <text x="432" y="430"
        font-family="Inter, system-ui, sans-serif"
        font-size="22" font-weight="500" fill="rgba(255,255,255,0.6)" letter-spacing="6">
    UNIVERSITY  OF  CALIFORNIA,  SANTA  BARBARA
  </text>
</svg>
